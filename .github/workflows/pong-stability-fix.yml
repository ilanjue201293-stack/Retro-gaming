name: Pong stability fix
on:
  push:
    branches: [pong-stability-fix]
    paths:
      - scripts/pong-stability-fix.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Pong patch
        run: python scripts/pong-stability-fix.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit Pong fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/PongGame.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize Pong networking and host start"
          git push origin HEAD:pong-stability-fix
