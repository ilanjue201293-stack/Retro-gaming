name: Fix realtime multiplayer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply multiplayer repair
        run: python3 scripts/fix-multiplayer-realtime.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Commit repair and cleanup
        run: |
          rm -f scripts/fix-multiplayer-realtime.py .github/workflows/fix-multiplayer-realtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair realtime multiplayer networking"
          git push
