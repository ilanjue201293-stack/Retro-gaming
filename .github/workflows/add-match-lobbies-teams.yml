name: Add Retro match lobbies and teams
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/add-match-lobbies-teams.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/add_match_lobbies_teams.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/HockeyGame.tsx app/PongGame.tsx app/RpsGame.tsx app/RetroApp.tsx app/api/rooms/route.ts lib/hockey-room.ts app/hockey-v6.css app/pong.css app/rps.css
          git commit -m "Add game replay lobbies and Hockey team setup"
          git push origin main
      - name: Remove temporary patch files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/add-match-lobbies-teams.yml scripts/add_match_lobbies_teams.py
          git commit -m "Remove temporary Retro patch files"
          git push origin main
