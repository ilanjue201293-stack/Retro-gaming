name: Fix Hockey and Pool v2
on:
  push:
    paths:
      - '.github/workflows/fix-hockey-pool-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/fix-hockey-pool-v2.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/fix-hockey-pool-v2.py
          rm .github/workflows/fix-hockey-pool-v2.yml
          git add -A
          git commit -m "Stabilize Hockey guest networking and improve Pool" || exit 0
          git push
