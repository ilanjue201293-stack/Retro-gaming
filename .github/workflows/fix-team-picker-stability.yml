name: Stabilize Hockey team picker
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/fix-team-picker-stability.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch stable team dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/HockeyGame.tsx')
          t=p.read_text()
          old='''  const onlineMembers = useMemo(() => room.members.filter((member) => member.online), [room.members]);\n  const online = onlineMembers.length;'''
          new='''  const onlineMembers = useMemo(() => room.members.filter((member) => member.online), [room.members]);\n  const onlineKey = onlineMembers.map((member) => member.id).join("|");\n  const online = onlineMembers.length;'''
          if old not in t: raise SystemExit('online members marker missing')
          t=t.replace(old,new,1)
          old='''  }, [game?.status, game?.mode, isHost, onlineMembers, twoPlayerSide]);'''
          new='''  }, [game?.status, game?.mode, isHost, onlineKey, twoPlayerSide]);'''
          if old not in t: raise SystemExit('team effect deps marker missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - run: npm install
      - run: npm run typecheck
      - name: Commit
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/HockeyGame.tsx
          git commit -m "Keep Hockey team choices stable"
          git push origin main
      - name: Cleanup
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-team-picker-stability.yml
          git commit -m "Remove temporary team picker workflow"
          git push origin main
