name: Patch chat and Dunkshot timer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fixes
        run: python3 scripts/patch-chat-dunkshot-timer.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Commit fixes and cleanup
        run: |
          rm -f scripts/patch-chat-dunkshot-timer.py .github/workflows/patch-chat-dunkshot-timer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix chat controls and improve Dunkshot timer"
          git push
