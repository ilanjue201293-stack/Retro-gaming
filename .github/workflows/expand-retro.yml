name: Expand Retro mini games
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-retro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply full game expansion
        run: python .github/scripts/expand_retro.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Commit final expansion
        run: |
          rm -f .github/workflows/expand-retro.yml .github/scripts/expand_retro.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mini games and unify room game controls"
          git push
