name: Fix gameplay regressions
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/fix-gameplay-regressions.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/fix_gameplay_regressions.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit fixes
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/HockeyGame.tsx app/PongGame.tsx app/RpsGame.tsx app/api/rps/route.ts
          git commit -m "Restore smooth Hockey and rebalance game bots"
          git push origin main
      - name: Remove temporary patch files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-gameplay-regressions.yml scripts/fix_gameplay_regressions.py
          git commit -m "Remove temporary gameplay patch files"
          git push origin main
