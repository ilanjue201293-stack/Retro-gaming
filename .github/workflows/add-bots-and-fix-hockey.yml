name: Apply bots and Hockey network fix
on:
  push:
    paths:
      - '.github/workflows/add-bots-and-fix-hockey.yml'
      - 'scripts/apply_bots_patch.py'
      - 'scripts/run_bots_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/run_bots_patch.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/HockeyGame.tsx lib/hockey-room.ts app/api/rooms/route.ts app/PongGame.tsx app/api/pong/route.ts app/RpsGame.tsx app/api/rps/route.ts app/bots.css app/layout.tsx
          git commit -m "Add solo bots and stabilize Hockey networking"
          git push origin main
      - name: Remove migration files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/add-bots-and-fix-hockey.yml scripts/apply_bots_patch.py scripts/run_bots_patch.py
          git commit -m "Remove bots migration files"
          git push origin main
