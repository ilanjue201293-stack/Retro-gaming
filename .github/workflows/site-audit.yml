name: Full site audit
on:
  push:
    branches: [main]
jobs:
  audit:
    if: github.event.head_commit.message == 'Prepare full site audit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/site-audit.py')
          s = p.read_text()
          bad = "replace_once('app/RetroApp.tsx', 'onClick={() => void createRoom()}', 'onClick={() => void createRoom(\"hockey\")}')\n"
          if bad not in s:
              raise SystemExit('runner repair anchor missing')
          p.write_text(s.replace(bad, '', 1))
          PY
      - name: Apply full audit patch
        run: python scripts/site-audit.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit audited site
        run: |
          rm -f scripts/site-audit.py
          git checkout -- .github/workflows/typecheck.yml .github/workflows/site-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit site stability and upgrade Hangman Hockey Dunkshot"
          git push
