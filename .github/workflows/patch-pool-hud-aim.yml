name: Patch Pool HUD and aim

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Pool patch
        run: python3 scripts/patch-pool-hud-aim.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patch and cleanup
        run: |
          rm -f scripts/patch-pool-hud-aim.py .github/workflows/patch-pool-hud-aim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Pool HUD rules and aim prediction"
          git push
