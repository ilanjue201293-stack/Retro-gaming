name: Integrate Pool game

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate Pool
        run: python3 scripts/integrate-pool-game.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Commit integration and cleanup
        run: |
          rm -f scripts/integrate-pool-game.py .github/workflows/integrate-pool-game.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Billard to Retro Gaming"
          git push
