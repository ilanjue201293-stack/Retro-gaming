name: Fix Hockey countdown synchronization
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/fix-hockey-countdowns.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/fix_hockey_countdowns.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/HockeyGame.tsx lib/hockey-room.ts
          git commit -m "Synchronize Hockey start and goal countdowns"
          git push origin main
      - name: Remove temporary patch files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-hockey-countdowns.yml scripts/fix_hockey_countdowns.py
          git commit -m "Remove temporary Hockey countdown patch files"
          git push origin main
