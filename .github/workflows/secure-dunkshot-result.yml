name: Secure Dunkshot result
on:
  push:
    paths:
      - scripts/secure_dunkshot_result.py
      - .github/workflows/secure-dunkshot-result.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch Dunkshot result authority
        run: python3 scripts/secure_dunkshot_result.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit result authority
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/dunkshot/route.ts
          git commit -m "Make Dunkshot duel scoring server authoritative"
          git push
      - name: Cleanup
        run: |
          git rm scripts/secure_dunkshot_result.py .github/workflows/secure-dunkshot-result.yml
          git commit -m "Remove temporary Dunkshot result workflow"
          git push
