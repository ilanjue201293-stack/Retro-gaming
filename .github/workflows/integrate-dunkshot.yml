name: Integrate Dunkshot
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/integrate-dunkshot.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/integrate_dunkshot.py
      - run: npm install
      - run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "Retro updater"
          git config user.email "actions@users.noreply.github.com"
          git add app/RetroApp.tsx app/layout.tsx app/api/dunkshot/route.ts
          git commit -m "Integrate Dunkshot into Retro Gaming"
          git push origin main
      - name: Remove temporary integration files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/integrate-dunkshot.yml scripts/integrate_dunkshot.py
          git commit -m "Remove temporary Dunkshot integration files"
          git push origin main
